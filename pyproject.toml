[project]
name = "document-qa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ahdgalal"}
]
requires-python = ">=3.12"
dependencies = [
    "dataclasses>=0.8",
    "fastapi>=0.143.3",
    "fastembed>=0.9.0",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.0",
    "pypdf>=6.21.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
document-qa = "document_qa:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
